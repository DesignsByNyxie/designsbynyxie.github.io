<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b120d">
<title>Glowcap</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--card:#16231a;--line:#2c4033;--cream:#f2e8d0;--muted:#94a58a;--gold:#c9a860;--gold2:#f0c96a;--sage:#9fb07f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b120d;color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0e1611}
#setup{display:none;max-width:420px;margin:0 auto;padding:40px 22px;text-align:center;overflow:auto;height:100%;font-family:Georgia,serif}
#setup img{width:110px;height:110px;border-radius:28px}
h1{color:var(--gold);font-size:24px;margin:14px 0 6px}#setup p{font-family:Arial,sans-serif;font-size:14px;line-height:1.5;color:#cfd8c4}
input{width:100%;background:#0f1912;border:1px solid var(--gold);color:var(--cream);border-radius:12px;padding:12px;font-size:16px;outline:none}
.gold{background:linear-gradient(180deg,#d8b86c,#b8954c);color:#1b1608;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;width:100%;margin-top:10px}
.err{color:#f3a0a0;font-size:13px;min-height:18px;margin-top:6px}
#splash{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;pointer-events:none;transition:opacity .5s;background:radial-gradient(ellipse at 50% 40%,#1a2a1f 0%,#0b120d 70%)}
#splash .grow{position:relative;width:120px;height:150px;display:flex;align-items:flex-end;justify-content:center}
#splash .grow img{position:absolute;bottom:0;height:150px;opacity:0;animation:fr 2.52s infinite steps(1)}
@keyframes fr{0%{opacity:1}16.66%{opacity:0}100%{opacity:0}}
html,body,#app,#card{touch-action:manipulation}
#splash .grow:after{content:'';position:absolute;bottom:-8px;width:120px;height:16px;border-radius:50%;background:radial-gradient(#f0c96a55,transparent 70%);animation:gl 2.4s ease-in-out infinite}
@keyframes gl{50%{opacity:.25}}
#splash span{font-style:italic;color:#e7d9b5;font-family:Georgia,serif;font-size:17px}
#splash .dots{display:flex;gap:7px}#splash .dots i{width:7px;height:7px;border-radius:50%;background:#c9a860;animation:dt 1.2s infinite ease-in-out}#splash .dots i:nth-child(2){animation-delay:.2s}#splash .dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
@keyframes b{50%{transform:scale(1.06)}}
/* pop-up card */
#dim{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#1a2a1f 0%,#070b08 75%);display:none}
#dim .hint{position:absolute;top:calc(28px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#5d6f58;font-size:12px}
#card{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:linear-gradient(180deg,#1b2b20,#111a14);border:1px solid #c9a86055;border-bottom:0;border-radius:26px 26px 0 0;padding:10px 14px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:0 -12px 40px #000c;display:none;animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:3px;background:#3c5243;margin:0 auto 10px}
.x{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#0f1912;color:var(--cream);font-size:16px;line-height:30px;padding:0;z-index:2}
.head{padding-right:40px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 10px}.head b{font-family:Georgia,serif;color:var(--gold);font-size:16px}.head span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.qt{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px 11px;color:var(--cream);font:inherit;text-align:center;min-height:108px;transition:transform .12s,background .2s,border-color .2s;user-select:none}
.qt:active{transform:scale(.95)}.qt .i{display:block;font-size:31px;line-height:1.1}
.qt .n{display:block;font-weight:700;font-size:13px;margin-top:6px;line-height:1.2}.qt small{display:block;color:var(--gold);font-size:12px;margin-top:4px;font-weight:700}
.qt.done{background:linear-gradient(135deg,#2a3a22,#1b2a1c);border-color:var(--gold);box-shadow:0 0 16px #c9a86040}.qt.done:after{content:"✔";position:absolute;top:7px;right:10px;color:var(--gold2);font-weight:800}
.qt .minus{position:absolute;top:5px;left:5px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#0f1912;color:var(--muted);font-size:16px;line-height:24px;padding:0}
.bar{height:5px;border-radius:4px;background:#0b120d;margin:6px 10px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--sage)}
.row{display:flex;gap:7px;margin-top:9px}.pick button{flex:1;border-radius:12px;border:1px solid var(--line);background:#0f1912;color:var(--cream);padding:9px 2px;font:inherit;font-weight:700;font-size:13px}
.pick button.on{border-color:var(--gold);background:#2a2716;color:var(--gold2)}
.ghost{display:block;margin:14px auto 0;background:none;border:1px solid var(--line);color:var(--cream);border-radius:12px;padding:9px 16px;font:inherit;font-size:13px}
.sync{font-size:11px;color:#5d6f58;text-align:center;margin-top:8px;min-height:14px}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:#2a2716;border:1px solid var(--gold);color:var(--gold2);padding:9px 18px;border-radius:30px;font-weight:800;z-index:9;transition:.3s;box-shadow:0 8px 30px #000a;max-width:92vw;text-align:center;font-size:14px}
#toast.show{transform:translate(-50%,0)}
.spark{position:fixed;pointer-events:none;z-index:8;font-size:16px;animation:sp .8s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px;grid-column:1/3}
</style></head><body>
<div id="splash"><div class="grow" id="grow"></div><span>Opening your quest log…</span><div class="dots"><i></i><i></i><i></i></div></div>
<iframe id="app" credentialless allow="clipboard-write" title="Glowcap"></iframe>
<div id="dim"><div class="hint">tap here or ✕ to close</div></div>
<div id="card"></div>
<div id="toast"></div>
<div id="setup">
  <img src="icon-192.png" alt="">
  <h1>✦ Glowcap</h1>
  <p>Paste your app link once. You'll find it in your spreadsheet under <b>✦ Glowcap → Phone app: setup &amp; link</b>.</p>
  <input id="u" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <div class="err" id="err"></div>
  <button class="gold" id="go">Save &amp; open Glowcap</button>
  <p style="font-size:12.5px;color:#94a58a">Then use your browser menu → <b>Install app</b> / <b>Add to Home screen</b>. Long-press the icon for <b>Quick log</b> and <b>Add side quest</b>.</p>
</div>
<script src="../glowcap/core.js"></script>
<script>
var KEY = 'questAppUrl', CKEY = 'questCache';
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function norm(v) {
  v = String(v || '').trim();
  var m = v.match(/macros\/(?:u\/\d+\/)?s\/([\w-]{20,})/) || v.match(/^([\w-]{40,})$/);
  return m ? 'https://script.google.com/macros/s/' + m[1] + '/exec' : '';
}
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
var TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
var q = new URLSearchParams(location.search), passed = norm(q.get('app'));
if (passed) { ls(KEY, passed); q.delete('app'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); }
var URL0 = ls(KEY) || '', VIEW = q.get('view') || '';

/* ---------- full app ---------- */
function openFull() {
  $('card').style.display = $('dim').style.display = 'none';
  $('splash').style.display = 'flex'; $('splash').style.opacity = 1;
  var f = $('app'); f.src = URL0; f.style.display = 'block';
  growAnim(); clearTimeout(openFull.t); openFull.t = setTimeout(hideSplash, 25000); // safety net
  if (VIEW) history.replaceState(null, '', location.pathname);
}

/* a little mushroom grows while the app loads; the app says when it's ready */
function growAnim() {
  var g = $('grow');
  if (!g.children.length) for (var i = 0; i < 6; i++) { var im = document.createElement('img'); im.src = '../art/grow' + i + '.png'; im.alt = ''; im.style.animationDelay = (i * 0.42) + 's'; g.appendChild(im); }
}
function hideSplash() { var s = $('splash'); s.style.opacity = 0; setTimeout(function () { s.style.display = 'none'; clearInterval(growAnim.t); }, 550); }
window.addEventListener('message', function (e) { if (e.data === 'glowcap-ready') hideSplash(); });

/* ---------- instant cards ---------- */
var QKEY = 'questQueue', C = null, queue = [], busy = false, diff = 'Easy', leaving = false;
try { queue = JSON.parse(ls(QKEY) || '[]'); } catch (e) { queue = []; }
function saveQ() { ls(QKEY, JSON.stringify(queue.filter(function (j) { return j.p.api !== 'state'; }))); }
try { C = JSON.parse(ls(CKEY) || 'null'); } catch (e) {}
function fresh() { // cache from another day: same quests, nothing done yet
  if (C && C.day !== today()) { C.day = today(); C.quests.forEach(function (x) { x.value = x.goal > 1 ? 0 : false; }); }
}
function save() { ls(CKEY, JSON.stringify(C)); }
/* talks to the sheet through its small rpc connection; the logic lives in ../glowcap/core.js */
function api(params) {
  var d = today(), req = {tz: TZ, r: GC.reads(d)};
  if (params.api === 'quest') req.w = GC.W.quest(d, Number(params.k), params.v === 'true' ? true : params.v === 'false' ? false : Number(params.v) || 0);
  else if (params.api === 'side') {
    var used = (C && C.sideRows) || [], row = GC.freeRow(used, GC.QL.SQF, GC.QL.SQN);
    if (!row) return Promise.reject(new Error('Your side quest list is full'));
    if (C) { C.sideRows = used.concat([row]); }
    req.w = GC.W.addSide(row, params.n, params.diff);
  }
  var u = URL0 + '?api=rpc&q=' + encodeURIComponent(JSON.stringify(req));
  return fetch(u, {credentials: 'omit', keepalive: true}).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error(j.error);
    var s = GC.parse(j, d);
    return {ok: true, day: d, name: s.name, level: s.level, title: s.title, xp: s.xp, sideOpen: s.side.open.length, sideRows: s.sideRows,
      quests: s.quests.map(function (q) { return {k: q.k, icon: q.icon, name: q.name, xp: q.xp, goal: q.goal, unit: q.unit, value: q.value}; })};
  });
}
function pump() {
  if (busy || !queue.length) return;
  busy = true; sync(queue[0].p.api === 'state' ? 'syncing…' : 'saving…');
  var job = queue[0];
  api(job.p).then(function (j) {
    busy = false; queue.shift(); saveQ();
    if (!queue.length) { C = j; save(); if (leaving) { reset(); return; } if (VIEW === 'side') { var sp = document.querySelector('.head span'); if (sp) sp.textContent = C.sideOpen + ' open'; } else render(); sync('✓ saved to your sheet'); }
    pump();
  }).catch(function () {
    busy = false; sync('offline — will retry'); setTimeout(pump, 4000);
  });
}
function sync(t) { var s = $('sync'); if (s) s.textContent = t; }
function isDone(x) { return x.goal > 1 ? Number(x.value) >= x.goal : x.value === true; }
function render() {
  var c = $('card'), h = '<button class="x" id="close" aria-label="Close">✕</button><div class="grab"></div>';
  if (VIEW === 'side') {
    h += '<div class="head"><b>✦ New side quest</b><span>' + (C ? C.sideOpen + ' open' : '') + '</span></div>' +
      '<input id="sqn" placeholder="e.g. Repot the monstera" maxlength="120" enterkeyhint="done" autocomplete="off">' +
      '<div class="row pick">' + ['Easy', 'Tricky', 'Epic'].map(function (d) { return '<button data-d="' + d + '" class="' + (diff === d ? 'on' : '') + '">' + d + ' · ' + {Easy: 10, Tricky: 25, Epic: 60}[d] + '</button>'; }).join('') + '</div>' +
      '<button class="gold" id="add">Add side quest ✦</button>';
  } else {
    var qs = C ? C.quests : [], dn = qs.filter(isDone).length;
    h += '<div class="head"><b>✦ Quick log</b><span>' + (C ? dn + ' of ' + qs.length + ' done today' : 'loading your quests…') + '</span></div><div class="grid">';
    qs.forEach(function (x) {
      var d = isDone(x), cnt = x.goal > 1;
      h += '<div class="qt ' + (d ? 'done' : '') + '" data-k="' + x.k + '" role="button">' + (cnt && Number(x.value) > 0 ? '<button class="minus" data-m="' + x.k + '">−</button>' : '') +
        '<span class="i">' + esc(x.icon) + '</span><span class="n">' + esc(x.name) + '</span><small>' +
        (cnt ? Number(x.value || 0) + ' / ' + x.goal + ' ' + esc(x.unit) : d ? 'done ✦' : '+' + x.xp + ' XP') + '</small>' +
        (cnt ? '<div class="bar"><i style="width:' + Math.min(100, Number(x.value || 0) / x.goal * 100) + '%"></i></div>' : '') + '</div>';
    });
    if (C && !qs.length) h += '<div class="empty">No quests yet — add them on the Quest Board tab.</div>';
    h += '</div>';
  }
  h += '<div class="sync" id="sync"></div><button class="ghost" id="full">Open the full app</button>';
  var keepVal = $('sqn') ? $('sqn').value : '';
  c.innerHTML = h; bind();
  if ($('sqn')) { $('sqn').value = keepVal; }
}
function bind() {
  $('full').onclick = function () { VIEW = ''; openFull(); };
  $('close').onclick = closeApp;
  document.querySelectorAll('.qt').forEach(function (el) {
    el.onclick = function (ev) {
      if (ev.target.dataset.m !== undefined) return;
      var x = C.quests.filter(function (y) { return y.k == el.dataset.k; })[0], was = isDone(x), v;
      if (x.goal > 1) { v = Math.min(x.goal, Number(x.value || 0) + 1); if (v === Number(x.value)) return; }
      else v = !(x.value === true);
      x.value = v; save(); render();
      if (!was && isDone(x)) { sparks(ev); toast('+' + x.xp + ' XP ✦ ' + x.name); } else if (x.goal > 1) toast(x.icon + ' ' + v + ' / ' + x.goal);
      queue.push({p: {api: 'quest', k: x.k, v: String(v)}}); saveQ(); pump();
    };
  });
  document.querySelectorAll('[data-m]').forEach(function (b) {
    b.onclick = function () {
      var x = C.quests.filter(function (y) { return y.k == b.dataset.m; })[0], v = Math.max(0, Number(x.value || 0) - 1);
      x.value = v; save(); render(); queue.push({p: {api: 'quest', k: x.k, v: String(v)}}); saveQ(); pump();
    };
  });
  document.querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { diff = b.dataset.d; render(); $('sqn').focus(); }; });
  var add = $('add');
  if (add) {
    var go = function (ev) {
      var n = $('sqn').value.trim(); if (!n) { $('sqn').focus(); return; }
      sparks(ev); toast('Added ✦ ' + n); if (C) C.sideOpen++;
      $('sqn').value = ''; render(); $('sqn').focus();
      queue.push({p: {api: 'side', n: n, diff: diff}}); saveQ(); pump();
    };
    add.onclick = go; $('sqn').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }
}
function toast(t) { var e = $('toast'); e.textContent = t; e.className = 'show'; clearTimeout(e._t); e._t = setTimeout(function () { e.className = ''; }, 1700); }
function sparks(ev) {
  var x = ev && ev.clientX || innerWidth / 2, y = ev && ev.clientY || innerHeight / 2;
  for (var i = 0; i < 10; i++) {
    var s = document.createElement('div'); s.className = 'spark'; s.textContent = ['✦', '✧', '✨', '·'][i % 4];
    s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.color = i % 2 ? '#f0c96a' : '#9fb07f';
    var an = Math.random() * Math.PI * 2, d = 40 + Math.random() * 50; s.style.setProperty('--x', Math.cos(an) * d + 'px'); s.style.setProperty('--y', Math.sin(an) * d + 'px');
    document.body.appendChild(s); setTimeout(function (e) { return function () { e.remove(); }; }(s), 850);
  }
  if (navigator.vibrate) navigator.vibrate(12);
}
function pending() { return queue.filter(function (j) { return j.p.api !== 'state'; }).length; }
function reset() { location.replace(location.pathname); } // next time the icon opens the full app
function closeApp() {
  if (pending()) { sync('saving before closing…'); var t0 = Date.now(); var w = setInterval(function () { if (!pending() || Date.now() - t0 > 8000) { clearInterval(w); closeApp(); } }, 200); return; }
  var c = $('card'); c.style.transition = 'transform .2s'; c.style.transform = 'translateY(100%)';
  setTimeout(function () {
    try { window.close(); } catch (e) {}
    setTimeout(function () { c.style.transform = ''; toast('Done ✦ press Home to leave'); }, 350);
  }, 180);
}
function dragClose() {
  var c = $('card'), y0 = null, dy = 0;
  c.addEventListener('touchstart', function (e) { if (c.scrollTop > 0 || e.target.tagName === 'INPUT') return; y0 = e.touches[0].clientY; dy = 0; c.style.transition = 'none'; }, {passive: true});
  c.addEventListener('touchmove', function (e) { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); c.style.transform = 'translateY(' + dy + 'px)'; }, {passive: true});
  c.addEventListener('touchend', function () { if (y0 === null) return; y0 = null; c.style.transition = 'transform .2s'; if (dy > 110) closeApp(); else c.style.transform = ''; });
  $('dim').onclick = closeApp;
}
function openCard() {
  dragClose();
  fresh();
  $('dim').style.display = 'block'; $('card').style.display = 'block'; render();
  if (VIEW === 'side') setTimeout(function () { $('sqn') && $('sqn').focus(); }, 80);
  // refresh quietly in the background
  queue.push({p: {api: 'state'}}); pump();
}
function setup() {
  $('setup').style.display = 'block';
  $('go').onclick = function () {
    var u = norm($('u').value);
    if (!u) { $('err').textContent = 'That does not look like your app link — it starts with https://script.google.com/macros/s/'; return; }
    ls(KEY, u); location.replace(location.pathname);
  };
}
if (!URL0 || q.has('setup')) setup();
else if (VIEW === 'quick' || VIEW === 'side') openCard();
else openFull();
document.addEventListener('visibilitychange', function () {
  if ($('card').style.display !== 'block') return;
  if (document.hidden) { leaving = true; if (!pending() && !busy) reset(); } else leaving = false;
});
if (VIEW !== 'quick' && VIEW !== 'side' && URL0 && queue.length) pump(); // send taps left over from last time
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body></html>
